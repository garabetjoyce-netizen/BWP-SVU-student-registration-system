<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Registration System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-brand">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill me-2"></i>StudentHub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="d-flex align-items-center py-5">
    <div class="container auth-wrapper">
      <div class="card card-soft p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="feature-icon mb-3"><i class="bi bi-box-arrow-in-right"></i></div>
          <h3 class="fw-bold">Welcome back</h3>
          <p class="text-muted small">Log in to manage student records</p>
        </div>

        <!-- Error / success messages appear here (e.g. login.html?error=invalid_credentials) -->
        <div id="formAlert"></div>

        <!-- The form is sent to the backend file login.php -->
        <form id="loginForm" action="login.php" method="POST" novalidate>
          <div class="mb-3">
            <label for="login" class="form-label">Username or Email</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="login" name="login" placeholder="john or john@example.com"
                     autocomplete="username" required>
              <div class="invalid-feedback">Please enter your username or email.</div>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Your password"
                     autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
          </div>

          <button type="submit" class="btn btn-brand w-100 py-2">
            <span class="spinner-border spinner-border-sm me-1 d-none" aria-hidden="true"></span>
            Login
          </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white-50 text-center py-3">
    <div class="container">&copy; <span class="js-year"></span> StudentHub &middot; BWP501 Project</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
